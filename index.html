:is(.topbar, .sidenav, .tabbar, .event, .task, .btn) svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.hx-city { background: none; border: 0; }
.hx-city span { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font: 700 12px var(--font); color: #4A5B70; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); padding: 8px 14px; border-radius: var(--radius-sm);
  font-weight: 600; cursor: pointer; white-space: nowrap; min-height: 38px;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-ink); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--canvas); }
.btn.danger { color: var(--red); border-color: transparent; background: transparent; }
.btn.danger:hover { background: var(--red-wash); }
.btn.block { width: 100%; justify-content: center; }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .6; cursor: default; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: min(380px, 100%); background: var(--surface); border-radius: var(--radius-lg);
  padding: 32px; border: 1px solid var(--line); display: grid; gap: 14px;
}
.login-logo { width: 100%; max-width: 320px; height: auto; background: #fff; padding: 14px 16px; border-radius: 12px; box-sizing: border-box; }
.login-card h1 { font-size: 24px; margin-bottom: 6px; }
.login-card label, .field label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
input, select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px;
  background: var(--surface); font-size: 15px; min-height: 40px;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-wash); border-color: var(--brand); }
.form-error { color: var(--red); margin: 0; font-size: 14px; }

/* Layout */
#app {
  display: grid; min-height: 100vh;
  grid-template-columns: 216px 1fr;
  grid-template-rows: var(--top-h) 1fr;
  grid-template-areas: "top top" "side main";
}
.topbar {
  grid-area: top; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  background: var(--bar); color: #fff;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bar); z-index: 30;
}
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 18px; width: 250px; flex: none; }
.wordmark { display: flex; align-items: baseline; gap: 0; letter-spacing: .14em; font-size: 15px; white-space: nowrap; }
.wordmark b { color: #fff; font-weight: 700; }
.wordmark i { color: #1FBAC2; font-style: normal; font-weight: 700; }
.wordmark small { margin-left: 8px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.3); color: rgba(255,255,255,.7); font-size: 11px; font-weight: 600; letter-spacing: .12em; }
.brand:hover { text-decoration: none; }
.brand img { width: 38px; height: 38px; flex: none; }
.search { position: relative; flex: 1; max-width: 640px; }
.search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 18px; height: 18px; }
.search input {
  padding-left: 40px; border: 0; background: #F0F3F6; color: #12263F; height: 42px; border-radius: 21px; font-size: 15px;
}
.search input:focus { background: #fff; outline: 3px solid rgba(14, 124, 134, .45); }
.search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink);
  border-radius: var(--radius); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(18, 38, 63, .18);
  overflow: hidden; max-height: 70vh; overflow-y: auto;
}
.search-results a {
  display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; color: var(--ink);
  border-bottom: 1px solid var(--canvas);
}
.search-results a:hover, .search-results a.on { background: var(--brand-wash); text-decoration: none; }
.search-results small { color: var(--ink-3); }
.search-results .empty { padding: 14px; color: var(--ink-3); }
.add-btn { border: 0; }
.topbar .add-btn { background: #1FBAC2; color: #022556; }
.topbar .add-btn:hover { background: #4FCDD3; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
  background: var(--brand); color: #fff; font-weight: 700; cursor: pointer;
}

.sidenav {
  grid-area: side; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: var(--top-h); align-self: start;
}
.sidenav a, .tabbar a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--ink-2); font-weight: 600;
}
.sidenav a:hover { background: var(--hover); text-decoration: none; }
.sidenav a.on { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 0 var(--brand); }
.tabbar { display: none; }

main { grid-area: main; padding: 26px 32px 60px; min-width: 0; outline: none; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px; }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-head h2 { font-size: 16px; font-weight: 700; }
.panel-head .count { color: var(--ink-3); font-weight: 600; margin-left: 6px; }
.muted { color: var(--ink-3); }
.empty-note { color: var(--ink-3); padding: 6px 0; margin: 0; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-2 > div > .panel + .panel { margin-top: 16px; }

/* Home stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px;
  color: inherit; display: block;
}
a.stat:hover { border-color: var(--brand); text-decoration: none; }
.stat b { display: block; font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-size: 14px; }
.stat small { display: block; color: var(--ink-3); margin-top: 2px; }
.stat.warn b { color: var(--amber); }

/* Chart */
.chart { display: flex; align-items: flex-end; gap: 14px; height: 170px; padding-top: 10px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.chart .bar { width: 100%; max-width: 46px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.chart .bar i { display: block; width: 100%; }
.chart .bar .new { background: var(--brand); border-radius: 0 0 4px 4px; }
.chart .bar .re { background: #1FBAC2; border-radius: 4px 4px 0 0; }
.chart .bar i:only-child { border-radius: 4px; }
.chart .lbl { font-size: 12px; color: var(--ink-3); }
.chart .num { font-size: 12px; font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Lists */
.rows { display: grid; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-top: 1px solid var(--canvas); min-width: 0;
}
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .main b { display: block; font-weight: 600; }
.row .main small { color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .side { text-align: right; color: var(--ink-2); font-size: 14px; white-space: nowrap; }
button.row, a.row { width: 100%; background: none; border: 0; border-top: 1px solid var(--canvas); text-align: left; cursor: pointer; color: inherit; font: inherit; }
button.row:first-child, a.row:first-child { border-top: 0; }
button.row:hover, a.row:hover { background: var(--hover); text-decoration: none; }

/* Account list */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px;
  font-weight: 600; font-size: 14px; cursor: pointer; color: var(--ink-2);
}
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.filters select { width: auto; min-height: 36px; padding: 6px 10px; font-size: 14px; }
.acct-list .row { padding: 13px 4px; }
.acct-list .meta { display: flex; gap: 18px; align-items: center; }
.acct-list .meta .n { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-prospect { background: var(--hover); color: var(--ink-2); }
.s-contacted { background: var(--blue-wash); color: var(--blue); }
.s-onboarding { background: var(--amber-wash); color: var(--amber); }
.s-active, .s-referring { background: var(--green-wash); color: var(--green); }
.s-contracted { background: var(--brand-wash); color: var(--brand-ink); }
.s-meeting-set, .s-proposal { background: var(--amber-wash); color: var(--amber); }
.team-row { display: grid; grid-template-columns: minmax(96px, 1fr) repeat(var(--cols, 3), minmax(38px, 54px)); gap: 4px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--canvas); font-size: 14px; }
.team-row b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-row .n { text-align: center; font-variant-numeric: tabular-nums; }
.team-row.head { color: var(--ink-3); font-size: 10.5px; line-height: 1.25; font-weight: 600; text-transform: uppercase; letter-spacing: 0; }
.team-row .over { color: var(--red); font-weight: 700; }
.s-stalled { background: var(--amber-wash); color: var(--amber); }
.s-lost { background: var(--red-wash); color: var(--red); }
.rep-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--brand-wash); color: var(--brand-ink); font-size: 11.5px; font-weight: 700; vertical-align: 2px; white-space: nowrap; }
.rep-tag.none { background: var(--canvas); color: var(--ink-3); }
.rep-aaron { background: #DCE8FF; color: #1D4ED8; } .rep-jamie { background: #FFE6D1; color: #C2410C; }
.rep-bryant { background: #D7F5E1; color: #15803D; } .rep-spencer { background: #FEF0B8; color: #8A5A00; }
.rep-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--ink-3); }
.rep-dot.rep-aaron { background: #2563EB; } .rep-dot.rep-jamie { background: #EA7A1F; } .rep-dot.rep-bryant { background: #22A05A; } .rep-dot.rep-spencer { background: #EAB308; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rep-aaron:not(.rep-dot) { background: #1E3366; color: #A9C4FF; } :root:not([data-theme="light"]) .rep-jamie:not(.rep-dot) { background: #4A2A12; color: #FFC08F; } :root:not([data-theme="light"]) .rep-bryant:not(.rep-dot) { background: #143D26; color: #8EE3AE; } :root:not([data-theme="light"]) .rep-spencer:not(.rep-dot) { background: #4A3B0A; color: #FDE68A; } }
:root[data-theme="dark"] .rep-aaron:not(.rep-dot) { background: #1E3366; color: #A9C4FF; } :root[data-theme="dark"] .rep-jamie:not(.rep-dot) { background: #4A2A12; color: #FFC08F; } :root[data-theme="dark"] .rep-bryant:not(.rep-dot) { background: #143D26; color: #8EE3AE; } :root[data-theme="dark"] .rep-spencer:not(.rep-dot) { background: #4A3B0A; color: #FDE68A; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--canvas); font-size: 12px; font-weight: 600; color: var(--ink-2); }
.due { font-weight: 600; font-size: 13px; }
.due.over { color: var(--red); }
.due.today { color: var(--amber); }

/* Account page */
.acct-head {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 22px 24px; margin-bottom: 16px; position: relative; overflow: hidden;
}
.acct-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--status-color, var(--ink-3)); }
.acct-head .crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.acct-head h1 { font-size: 30px; font-weight: 800; letter-spacing: -.015em; }
.acct-head .sub { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; color: var(--ink-2); }
.acct-head .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.status-btn { border: 0; cursor: pointer; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; gap: 10px; }
.kpis div b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpis div span { font-size: 13px; color: var(--ink-3); }

.contact { padding: 12px 0; border-top: 1px solid var(--canvas); }
.contact:first-child { border-top: 0; padding-top: 2px; }
.contact .name { display: flex; justify-content: space-between; gap: 8px; }
.contact .name button { background: none; border: 0; padding: 0; font-weight: 700; cursor: pointer; text-align: left; }
.contact .name button:hover { color: var(--brand-ink); }
.contact .role { color: var(--ink-3); font-size: 14px; }
.contact .links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 14px; }
.dm { font-size: 12px; color: var(--brand-ink); font-weight: 700; }

dl.details { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 14px; }
dl.details dt { color: var(--ink-3); }
dl.details dd { margin: 0; overflow-wrap: anywhere; }
.notes { white-space: pre-wrap; margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }

.timeline { display: grid; }
.event { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--canvas); cursor: pointer; }
.event:first-child { border-top: 0; padding-top: 2px; }
.event:hover .body b { color: var(--brand-ink); }
.event .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-wash); color: var(--brand-ink); }
.event .ico svg { width: 17px; height: 17px; }
.event .body b { display: block; }
.event .body .when { font-size: 13px; color: var(--ink-3); }
.event .body p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.email-paste { width: 100%; min-height: 260px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.email-match { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--brand-wash); color: var(--brand-ink); font-size: 13px; }
.event .body .next { margin-top: 6px; font-size: 14px; }
.event .body .next b { display: inline; color: var(--ink); }

.task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--canvas); }
.task:first-child { border-top: 0; }
.task .check {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ink-3); background: var(--surface);
  cursor: pointer; flex: none; margin-top: 1px; display: grid; place-items: center; padding: 0;
}
.task .check:hover { border-color: var(--brand); background: var(--brand-wash); }
.task.done .check { background: var(--brand); border-color: var(--brand); color: #fff; }
.task.done .check svg { width: 14px; height: 14px; }
.task .t { flex: 1; min-width: 0; }
.task .t button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; }
.task.done .t button { text-decoration: line-through; color: var(--ink-3); }
.task .t small { display: block; color: var(--ink-3); }
.task .cal { color: var(--ink-3); background: none; border: 0; cursor: pointer; padding: 4px; border-radius: 6px; }
.task .cal:hover { color: var(--brand-ink); background: var(--brand-wash); }

table.orders { width: 100%; border-collapse: collapse; font-size: 14px; }
table.orders th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.orders td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--canvas); }
table.orders tr { cursor: pointer; }
table.orders tbody tr:hover td { background: var(--hover); }
.scroll-x { overflow-x: auto; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-color: var(--brand); }
.group-label { font-size: 14px; font-weight: 700; margin: 18px 0 4px; color: var(--ink-2); }
.group-label.over { color: var(--red); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(18, 38, 63, .45); z-index: 50;
  display: grid; place-items: center; padding: 20px;
}
.modal {
  width: min(560px, 100%); max-height: calc(100vh - 40px); background: var(--surface); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(18, 38, 63, .3);
}
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal header h2 { font-size: 19px; }
.modal header button { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--ink-3); padding: 0 4px; }
.modal-body { padding: 18px 22px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field.full { grid-column: 1 / -1; }
.field .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 4px; }
.field .checks label, .field label.inline { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); font-size: 15px; }
.field input[type=checkbox] { width: 18px; height: 18px; min-height: 0; }
.field .hint { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.modal footer { display: flex; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); align-items: center; }
.modal footer .grow { flex: 1; }
.modal .form-error { grid-column: 1 / -1; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--bar); color: #fff;
  padding: 10px 18px; border-radius: 999px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 60;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.loading { padding: 60px 0; text-align: center; color: var(--ink-3); }
.banner { background: var(--amber-wash); color: var(--ink); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }


/* Map */
.map-wrap { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.map-panel { padding: 0; overflow: hidden; }
.map { height: min(72vh, 680px); min-height: 380px; background: var(--canvas); z-index: 0; }
.map-note { margin: 0; padding: 10px 14px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line); }
.map-legend { margin-left: auto; }
.inview { max-height: min(60vh, 600px); overflow-y: auto; }
.hx-pin-wrap { background: none; border: 0; }
.hx-pin {
  display: block; width: 28px; height: 28px; background: var(--c); border: 3px solid #fff;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.hx-pin::after { content: ""; position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; left: 7px; top: 7px; }
.hx-cluster { background: none; }
.hx-cluster span {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: #12263F; color: #fff; font: 800 15px var(--font); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.leaflet-container { font-family: var(--font); }
.leaflet-popup-content-wrapper { border-radius: var(--radius); }
.leaflet-popup-content { margin: 14px 16px; }
.hx-pop { display: grid; gap: 6px; min-width: 190px; color: #12263F; }
.hx-pop b { font-size: 15px; }
.hx-pop .muted { font-size: 13px; color: #6B7A8C; }
.hx-pop .btn { justify-self: start; margin-top: 4px; color: #fff; }
.hx-pop .btn:hover { text-decoration: none; }
.contact .talks { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.chart.dense { gap: 6px; }
.chart.dense .num { font-size: 11px; }
@media (max-width: 1100px) { .map-wrap { grid-template-columns: 1fr; } .map-legend { margin-left: 0; } .map { height: 60vh; } }

/* Tablet */
@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Phone */
@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
  .sidenav { display: none; }
  .topbar { gap: 10px; padding: 0 12px; }
  .brand { width: auto; }
  .brand span { display: none; }
  .add-btn span { display: none; }
  .add-btn { padding: 8px 10px; }
  .avatar { width: 34px; height: 34px; }
  main { padding: 18px 14px calc(90px + env(safe-area-inset-bottom, 0px)); }
  .page-head h1 { font-size: 24px; }
  .acct-head { padding: 18px; }
  .acct-head h1 { font-size: 24px; }
  .acct-head .actions .btn { flex: 1 1 auto; justify-content: center; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .acct-list .meta .n { display: none; }
  .modal-backdrop { padding: 0; place-items: end stretch; }
  .modal { width: 100%; max-height: 92vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .modal-body { grid-template-columns: 1fr; }
  .modal footer { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar a { flex: 1; flex-direction: column; gap: 2px; font-size: 12px; padding: 6px; }
  .tabbar a.on { color: var(--brand-ink); }
  .tabbar a:hover { text-decoration: none; }
  #toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Delete confirm */
.modal.confirm { width: min(440px, 100%); }
.confirm-body { padding: 16px 22px 4px; color: var(--ink-2); }
.confirm-body p { margin: 0 0 12px; }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger-solid:hover { filter: brightness(.92); }
.danger-zone { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
@media (max-width: 760px) { .modal.confirm { border-radius: var(--radius-lg) var(--radius-lg) 0 0; } }

async function loadAll() {
  const q = (t, order, asc = true) => sb.from(t).select('*').order(order, { ascending: asc }).range(0, 9999);
  const res = await Promise.all([
    q('accounts', 'name'), q('contacts', 'name'), q('activities', 'date', false),
    q('tasks', 'due'), q('team', 'name'),
  ]);
  const err = res.find(r => r.error);
  if (err) { state.loadError = err.error.message; return; }
  [state.accounts, state.contacts, state.activities, state.tasks, state.team] = res.map(r => r.data);
  state.referrals = [];
  state.loadError = null;
  const email = state.session?.user?.email?.toLowerCase();
  state.me = state.team.find(t => t.email.toLowerCase() === email) || { name: state.session?.user?.email?.split('@')[0] || 'Me', email };
  computeStats();
  state.loaded = true;
}

function computeStats() {
  const m = new Map();
  for (const a of state.accounts) m.set(a.id, { total: 0, seen: 0, lost: 0, open: 0, lastRef: null, lastContact: null, openTasks: 0 });
  for (const o of state.referrals) {
    const s = m.get(o.account_id); if (!s) continue;
    s.total++;
    if (o.outcome === 'Seen' || o.outcome === 'Scheduled') s.seen++; else if (o.outcome === 'Lost') s.lost++; else s.open++;
    if (o.date && (!s.lastRef || o.date > s.lastRef)) s.lastRef = o.date;
  }
  for (const x of state.activities) {
    const s = m.get(x.account_id); if (!s) continue;
    if (x.date && (!s.lastContact || x.date > s.lastContact)) s.lastContact = x.date;
  }
  for (const t of state.tasks) { const s = m.get(t.account_id); if (s && !t.done) s.openTasks++; }
  const d30 = addDays(todayISO(), -30);
  for (const x of state.activities) { const s = m.get(x.account_id); if (s && x.date >= d30) s.acts30 = (s.acts30 || 0) + 1; }
  for (const s of m.values()) {
    const closed = s.seen + s.lost;
    s.rate = closed ? Math.round(s.seen / closed * 100) : null;
    s.daysSinceRef = daysSince(s.lastRef);
    s.daysSinceContact = daysSince(s.lastContact);
  }
  state.stats = m;
}
const st = id => state.stats.get(id) || { total: 0, seen: 0, lost: 0, open: 0, rate: null, lastRef: null, lastContact: null, daysSinceRef: null, openTasks: 0 };

function chart(orders = state.referrals, count = 6) {
  const months = [];
  const d = new Date(); d.setDate(1);
  for (let i = count - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push({ key: `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`, label: x.toLocaleDateString('en-US', { month: count > 6 ? 'narrow' : 'short' }) }); }
  for (const m of months) {
    const os = orders.filter(o => (o.date || '').startsWith(m.key));
    m.nw = os.filter(o => o.outcome === 'Seen' || o.outcome === 'Scheduled').length; m.re = os.length - m.nw;
  }
  const max = Math.max(1, ...months.map(m => m.nw + m.re));
  if (!orders.some(o => o.date)) return '<p class="empty-note">Referrals chart here by month once they have dates. New referrals you add will show up right away.</p>';
  return `<div class="chart${count > 6 ? ' dense' : ''}">${months.map(m => `<div class="col"><span class="num">${m.nw + m.re || ''}</span>
    <div class="bar">${m.re ? `<i class="re" style="height:${m.re / max * 100}%"></i>` : ''}${m.nw ? `<i class="new" style="height:${m.nw / max * 100}%"></i>` : ''}</div>
    <span class="lbl">${m.label}</span></div>`).join('')}</div>`;
}

function mapAccounts() {
  const f = state.mapFilter, ow = state.mapOwner;
  const list = state.accounts.filter(a =>
    (f === 'All' || (f === 'Pipeline' ? PIPELINE.includes(a.status) : f === 'Active' ? isActive(a.status) : a.status === f)) &&
    (ow === 'All' || (ow === 'Unassigned' ? !a.owner : a.owner === ow)) &&
    (state.mapType === 'All' || a.account_type === state.mapType));
  const mapped = [], missing = [];
  for (const a of list) { const c = coordsFor(a); if (c) mapped.push({ a, lat: c[0], lng: c[1] }); else missing.push(a); }
  return { mapped, missing };
}

let mapObj = null;
function mountMap() {
  if (mapObj) { mapObj.remove(); mapObj = null; }
  const el = document.getElementById('map');
  if (!el) return;
  if (!window.L || !L.markerClusterGroup) { el.innerHTML = '<p class="empty-note" style="padding:20px">The map library didn\'t load. Check your connection and reload.</p>'; return; }
  const { mapped } = mapAccounts();
  const map = L.map(el, { zoomControl: true, scrollWheelZoom: true, tap: true });
  const titleCase = k => k.split('|')[0].replace(/\b\w/g, c => c.toUpperCase());
  const label = k => L.marker(CITY_COORDS[k], { interactive: false, keyboard: false, icon: L.divIcon({ className: 'hx-city', html: `<span>${esc(titleCase(k))}</span>`, iconSize: [0, 0] }) });
  const majorLabels = L.layerGroup(MAJOR_CITIES.filter(k => CITY_COORDS[k]).map(label));
  const minorLabels = L.layerGroup(Object.keys(CITY_COORDS).filter(k => !MAJOR_CITIES.includes(k) && !/^(st |saint |la vista|clive|johnston|altoona|leawood)/.test(k)).map(label));
  const syncLabels = () => { if (!fellBack) return; majorLabels.addTo(map); if (map.getZoom() >= 6) minorLabels.addTo(map); else map.removeLayer(minorLabels); };
  // Street map sources, tried in order. If one is blocked, the next one loads.
  const SOURCES = [
    { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attribution: 'Tiles &copy; Esri', maxZoom: 19 },
    { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19 },
  ];
  let fellBack = false, current = null;
  const useSource = i => {
    if (current) map.removeLayer(current);
    if (i >= SOURCES.length) {
      fellBack = true; current = null;
      const note = document.getElementById('map-note'); if (note) note.hidden = false;
      loadUsStates().then(us => {
        if (us && mapObj === map) L.geoJSON(us, { style: { color: '#8C9BAD', weight: 1.5, fillColor: '#FFFFFF', fillOpacity: 1 }, interactive: false }).addTo(map).bringToBack();
        syncLabels();
      });
      return;
    }
    let errors = 0, loaded = 0;
    current = L.tileLayer(SOURCES[i].url, { attribution: SOURCES[i].attribution, maxZoom: SOURCES[i].maxZoom }).addTo(map);
    current.on('tileload', () => { loaded++; });
    current.on('tileerror', () => { errors++; if (errors >= 3 && loaded === 0) useSource(i + 1); });
  };
  useSource(0);
  map.on('zoomend', syncLabels);
  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 42, spiderfyOnMaxZoom: true,
    iconCreateFunction: c => L.divIcon({ html: `<span>${c.getChildCount()}</span>`, className: 'hx-cluster', iconSize: [40, 40] }),
  });
  for (const { a, lat, lng } of mapped) {
    const m = L.marker([lat, lng], {
      title: a.name, keyboard: true,
      icon: L.divIcon({ className: 'hx-pin-wrap', html: `<span class="hx-pin" style="--c:${pinColor(a.status)}"></span>`, iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -32] }),
    });
    const s = st(a.id);
    m.bindPopup(`<div class="hx-pop"><b>${esc(a.name)}</b><div>${pill(a.status)}</div>
      <div class="muted">${esc([a.account_type, [a.city, a.state].filter(Boolean).join(', ')].filter(Boolean).join(', '))}</div>
      <div class="muted">${s.lastContact ? `Last contact ${esc(relDate(s.lastContact))}` : 'No contact yet'}</div>
      <a class="btn sm primary" href="#/account/${a.id}">Open account</a></div>`);
    cluster.addLayer(m);
  }
  map.addLayer(cluster);
  if (state.mapView) map.setView(state.mapView.c, state.mapView.z);
  else if (mapped.length) map.fitBounds(cluster.getBounds(), { padding: [40, 40], maxZoom: 11 });
  else map.setView(US_VIEW.c, US_VIEW.z);

  const listEl = document.getElementById('inview'), countEl = document.getElementById('inview-count');
  const updateList = () => {
    const b = map.getBounds();
    const vis = mapped.filter(p => b.contains([p.lat, p.lng])).sort((x, y) => x.a.name.localeCompare(y.a.name));
    countEl.textContent = vis.length;
    listEl.innerHTML = vis.length ? vis.slice(0, 60).map(({ a }) => `<a class="row" href="#/account/${a.id}">
      <div class="main"><b>${esc(a.name)}</b><small>${esc([a.city, a.state].filter(Boolean).join(', '))}</small></div>${pill(a.status)}</a>`).join('')
      : '<p class="empty-note">No accounts in this part of the map. Zoom out or drag to find some.</p>';
  };
  map.on('moveend', () => { state.mapView = { c: map.getCenter(), z: map.getZoom() }; updateList(); });
  updateList();
  setTimeout(() => map.invalidateSize(), 50);
  mapObj = map;
}

function viewTasks() {
  const tab = 'all', me = state.me?.name, today = todayISO();
  let open = state.tasks.filter(t => !t.done);
  if (tab === 'mine') open = open.filter(t => t.assigned_to === me);
  const over = open.filter(t => t.due && t.due < today);
  const tod = open.filter(t => t.due === today);
  const week = open.filter(t => t.due && t.due > today && t.due <= addDays(today, 7));
  const later = open.filter(t => !t.due || t.due > addDays(today, 7));
  const done = state.tasks.filter(t => t.done && (tab !== 'mine' || t.assigned_to === me))
    .sort((a, b) => (b.completed_at || '').localeCompare(a.completed_at || '')).slice(0, 10);
  const group = (label, list, cls = '') => list.length ? `<div class="group-label ${cls}">${label} (${list.length})</div>${list.map(t => taskRow(t)).join('')}` : '';
  return `
  <div class="page-head"><div><h1>Follow ups</h1><p>${open.length} open across the team</p></div>
    <button class="btn primary" data-action="new-task">Add follow up</button></div>
  <section class="panel">
    ${open.length ? group('Overdue', over, 'over') + group('Today', tod) + group('Next 7 days', week) + group('Later', later) : '<p class="empty-note">No open follow ups.</p>'}
    ${done.length ? group('Recently done', done) : ''}
  </section>`;
}

/* ---------- Confirm dialog ---------- */
function confirmDialog({ title, body, confirmLabel = 'Delete' }) {
  return new Promise(resolve => {
    const host = document.createElement('div');
    host.innerHTML = `<div class="modal-backdrop" style="z-index:70"><div class="modal confirm" role="alertdialog" aria-modal="true" aria-labelledby="cd-title">
      <header><h2 id="cd-title">${esc(title)}</h2></header>
      <div class="confirm-body">${body}</div>
      <footer><span class="grow"></span><button type="button" class="btn ghost" data-no>Cancel</button><button type="button" class="btn danger-solid" data-yes>${esc(confirmLabel)}</button></footer>
    </div></div>`;
    document.body.appendChild(host);
    const done = v => { host.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    host.querySelector('[data-no]').onclick = () => done(false);
    host.querySelector('[data-yes]').onclick = () => done(true);
    host.querySelector('.modal-backdrop').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-backdrop')) done(false); });
    host.querySelector('[data-no]').focus();
  });
}

function deleteAccountFlow(a) {

    .filter(([c]) => c).map(([c, one, many]) => `${c} ${c === 1 ? one : many}`);
  return confirmDialog({
    title: `Delete ${a.name}?`,
    body: `<p>This removes the account for good${parts.length ? `, along with its ${parts.join(', ')}` : ''}. You can't undo it.</p>`,
    confirmLabel: 'Delete account',
  }).then(async ok => {

/* ---------- Forms ---------- */
const optList = arr => arr.map(v => (typeof v === 'string' ? { value: v, label: v } : v));

function fieldHtml(f, v) {
  const id = 'f_' + f.name, full = (f.full ? ' full' : '') + (f.showIf ? '" data-showif="' + f.showIf.join('=') : '');
  const req = f.required ? 'required' : '';
  if (f.type === 'textarea') return `<div class="field${full}"><label for="${id}">${f.label}<textarea id="${id}" name="${f.name}" ${req} placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea></label></div>`;
  if (f.type === 'select') return `<div class="field${full}"><label for="${id}">${f.label}<select id="${id}" name="${f.name}" ${req}>
    ${f.blank !== false ? `<option value="">${esc(f.blank || 'Choose')}</option>` : ''}
    ${optList(f.options).map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(v ?? '') ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label></div>`;
  if (f.type === 'checks') return `<div class="field${full}"><label>${f.label}</label><div class="checks">${f.options.map(o => `<label><input type="checkbox" name="${f.name}" value="${esc(o)}" ${(v || []).includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div></div>`;
  if (f.type === 'checkbox') return `<div class="field${full}"><label class="inline"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}>${f.label}</label></div>`;
  return `<div class="field${full}"><label for="${id}">${f.label}${f.hint ? ` <span class="hint">${f.hint}</span>` : ''}<input id="${id}" type="${f.type || 'text'}" name="${f.name}" value="${esc(v)}" ${req} ${f.type === 'number' ? 'step="any"' : ''} placeholder="${esc(f.placeholder || '')}"></label></div>`;
}

function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    if (f.type === 'checks') out[f.name] = [...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(i => i.value);
    else if (f.type === 'checkbox') out[f.name] = form.elements[f.name].checked;
    else {
      const raw = form.elements[f.name].value.trim();
      out[f.name] = raw === '' ? null : (f.type === 'number' ? Number(raw) : raw);
    }
  }
  return out;
}

function openForm({ title, fields, values = {}, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete' }) {
  const root = $('#modal-root');
  const lastFocus = document.activeElement;
  root.innerHTML = `<div class="modal-backdrop"><form class="modal" novalidate>
    <header><h2>${esc(title)}</h2><button type="button" data-close aria-label="Close">&times;</button></header>
    <div class="modal-body">${fields.map(f => fieldHtml(f, values[f.name])).join('')}<p class="form-error" hidden></p></div>
    <footer>${onDelete ? `<button type="button" class="btn danger" data-del>${deleteLabel}</button>` : ''}<span class="grow"></span>
      <button type="button" class="btn ghost" data-close>Cancel</button><button type="submit" class="btn primary">${submitLabel}</button></footer>
  </form></div>`;
  const backdrop = root.firstElementChild, form = $('form', root), errEl = $('.form-error', root);
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', onKey); lastFocus?.focus?.(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  backdrop.addEventListener('mousedown', e => { if (e.target === backdrop) close(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  const fail = e => { errEl.textContent = e.message || String(e); errEl.hidden = false; };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const missing = fields.find(f => f.required && !form.elements[f.name].value.trim());
    if (missing) return fail({ message: `${missing.label} is required.` });
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { await onSubmit(readForm(form, fields)); close(); } catch (err) { fail(err); btn.disabled = false; }
  });
  if (onDelete) $('[data-del]', root).addEventListener('click', async () => {
    try { const r = await onDelete(); if (r !== false) close(); } catch (err) { fail(err); }
  });
  const syncShow = () => root.querySelectorAll('[data-showif]').forEach(el => {
    const [name, val] = el.dataset.showif.split('=');
    el.hidden = form.elements[name]?.value !== val;
  });
  form.addEventListener('change', syncShow); syncShow();
  setTimeout(() => form.querySelector('input:not([type=checkbox]), select, textarea')?.focus(), 30);
}

/* ---------- Add email (paste) ---------- */
const EMAIL_RE = /[\w.+'-]+@[\w-]+(?:\.[\w-]+)+/g;
function parseEmail(raw) {
  const text = String(raw || '').replace(/\r/g, '').trim();
  const lines = text.split('\n');
  const head = {}; let lastHead = -1;
  for (let i = 0; i < Math.min(lines.length, 40); i++) {
    const m = lines[i].match(/^\s*(From|Sent|Date|To|Cc|Subject)\s*:\s*(.*)$/i);
    if (m) { const k = m[1].toLowerCase(); if (!(k in head)) head[k] = m[2].trim(); lastHead = i; }
    else if (lastHead >= 0 && i > lastHead + 1 && Object.keys(head).length >= 2) break;
  }
  const body = (lastHead >= 0 ? lines.slice(lastHead + 1) : lines).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  const fromRaw = head.from || '';
  const fromEmail = (fromRaw.match(EMAIL_RE) || [])[0] || '';
  const fromName = fromRaw.replace(/<[^>]*>/g, '').replace(EMAIL_RE, '').replace(/["']/g, '').trim();
  const all = [...new Set([fromRaw, head.to, head.cc].join(' ').match(EMAIL_RE) || [])].map(e => e.toLowerCase());
  let date = todayISO();
  const ds = (head.sent || head.date || '').replace(/\s+at\s+/i, ' ').replace(/\(.*\)/, '').trim();
  const t = ds ? Date.parse(ds) : NaN;
  if (!isNaN(t)) { const d = new Date(t); date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  const firstLine = body.split('\n').find(l => l.trim()) || '';
  return { subject: head.subject || '', fromName, fromEmail: fromEmail.toLowerCase(), to: head.to || '', all, date, body, firstLine, hasHeaders: lastHead >= 0 };
}
function matchEmail(p) {
  const teamEmails = new Set(state.team.map(t => (t.email || '').toLowerCase()));
  const sender = state.team.find(t => (t.email || '').toLowerCase() === p.fromEmail || (p.fromName && t.name.toLowerCase() === p.fromName.toLowerCase()));
  const outside = p.all.filter(e => !teamEmails.has(e));
  let contact = state.contacts.find(c => c.email && outside.includes(c.email.toLowerCase()));
  if (!contact && !sender && p.fromName) contact = state.contacts.find(c => c.name.toLowerCase() === p.fromName.toLowerCase());
  let account = contact ? acct(contact.account_id) : null;
  if (!account) { const doms = outside.map(e => e.split('@')[1]); account = state.accounts.find(a => a.email_domain && doms.includes(a.email_domain.toLowerCase().replace(/^@/, ''))) || null; }
  const recipient = sender ? null : state.team.find(t => t.email && (p.to.toLowerCase().includes(t.email.toLowerCase()) || p.to.toLowerCase().includes(t.name.toLowerCase())));
  return { sender, recipient, contact, account, outsideEmail: sender ? (outside[0] || '') : (p.fromEmail || outside[0] || '') };
}
function emailForm(accountId) {
  openForm({
    title: 'Add email',
    fields: [{ name: 'raw', label: 'Paste the email', hint: 'No patient info. Delete any patient names, room numbers or wound details before you log it.', type: 'textarea', full: true, required: true, placeholder: 'Open the email, select all (Ctrl+A), copy (Ctrl+C) and paste it here. Include the From, To and Subject lines if you can.' }],
    submitLabel: 'Next',

      const sameAcct = m.contact && m.contact.account_id === aId;

    values: t || { account_id: accountId, due: addDays(todayISO(), 7), assigned_to: state.me?.name, priority: 'Medium' },
    submitLabel: t ? 'Save changes' : 'Add follow up',
    onSubmit: async v => {
      v.completed_at = v.done ? (t?.completed_at || new Date().toISOString()) : null;
      await save('tasks', v, t?.id); toast(t ? 'Follow up saved' : 'Follow up added');
    },
    onDelete: t ? async () => { if (!await confirmDialog({ title: 'Delete this follow up?', body: '<p>You can\'t undo this.</p>' })) return false; await remove('tasks', t.id); toast('Follow up deleted'); } : null,
  });
}

function orderForm(accountId, o) {
  openForm({
    title: o ? 'Edit referral' : 'Add referral',
    fields: [
      { name: 'date', label: 'Referral date', type: 'date', required: true },
      { name: 'outcome', label: 'Outcome', type: 'select', options: OUTCOMES, blank: false },
      { name: 'setting', label: 'Setting', type: 'select', options: SERVICES },
      { name: 'wound_type', label: 'Wound type', type: 'select', options: WOUND_TYPES },
      { name: 'referred_by', label: 'Referred by', placeholder: 'Provider, case manager, DON' },
      { name: 'lost_reason', label: 'Lost reason', type: 'select', options: LOST_REASONS, showIf: ['outcome', 'Lost'] },
      { name: 'ref_id', label: 'Referral # (no patient names)', full: true, hint: 'Use your Smartsheet row or EMR referral number to keep PHI out of the CRM' },
    ],
    values: o || { date: todayISO(), outcome: 'Pending', setting: acct(accountId)?.services?.[0] || 'Clinic' },
    submitLabel: o ? 'Save changes' : 'Add referral',
    onSubmit: async v => { if (v.outcome !== 'Lost') v.lost_reason = null; await save('referrals', o ? v : { ...v, account_id: accountId }, o?.id); toast(o ? 'Referral saved' : 'Referral added'); },
    onDelete: o ? async () => { if (!await confirmDialog({ title: 'Delete this referral?', body: '<p>You can\'t undo this.</p>' })) return false; await remove('referrals', o.id); toast('Referral deleted'); } : null,
  });
}

/* ---------- Calendar file ---------- */
function downloadIcs(t) {
  const a = acct(t.account_id);
  const d = t.due.replace(/-/g, ''), d2 = addDays(t.due, 1).replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const clean = s => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const summary = clean(t.title + (a ? ` (${a.name})` : ''));
  const desc = clean([t.notes, a ? `Account: ${a.name}` : '', `${location.origin}/#/account/${t.account_id || ''}`].filter(Boolean).join('\n'));
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//QuantumCare CRM//EN', 'BEGIN:VEVENT', `UID:${t.id}@quantumcare-crm`, `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d2}`, `SUMMARY:${summary}`, `DESCRIPTION:${desc}`,
    'BEGIN:VALARM', 'TRIGGER:PT8H', 'ACTION:DISPLAY', 'DESCRIPTION:QuantumCare follow up', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  const link = document.createElement('a'); link.href = url; link.download = 'follow-up.ics';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- Clicks ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  const statLink = e.target.closest('[data-filter-status]');
  if (statLink) { state.filters = { ...state.filters, status: statLink.dataset.filterStatus, type: 'All', owner: 'All', st: 'All', specialty: 'All', sys: 'All' }; }
  if (!el) return;
  const { action, id } = el.dataset;
  switch (action) {
    case 'new-account': closeSearch(); searchInput.value = ''; return accountForm(null, el.dataset.name);
    case 'edit-account': return accountForm(acct(id));
    case 'delete-account': return deleteAccountFlow(acct(id));
    case 'new-contact': return contactForm(id);
    case 'edit-contact': return contactForm(null, contact(id));
    case 'new-activity': return activityForm(id);
    case 'add-email': return emailForm(id || null);
    case 'edit-activity': return activityForm(null, state.activities.find(x => x.id === id));
    case 'new-task': return taskForm(id || (route().r === 'account' ? route().id : null));
    case 'edit-task': return taskForm(null, state.tasks.find(t => t.id === id));
    case 'new-order': return orderForm(id);
    case 'edit-order': return orderForm(null, state.referrals.find(o => o.id === id));
    case 'ics': return toast('In the live version this adds the follow up to your calendar');
    case 'scroll-quiet': return $('#quiet')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    case 'map-filter': state.mapFilter = el.dataset.v; state.mapView = null; return render();
    case 'map-reset': state.mapView = null; return render();
    case 'map-us': state.mapView = { ...US_VIEW }; return render();
    case 'task-tab': state.taskTab = el.dataset.v; return render();
    case 'filter': state.filters[el.dataset.k] = el.dataset.v; return render();
    case 'toggle-task': {
      const t = state.tasks.find(x => x.id === id);
      el.disabled = true;
      try { await save('tasks', { done: !t.done, completed_at: t.done ? null : new Date().toISOString() }, id); toast(t.done ? 'Reopened' : 'Done'); }
      catch (err) { toast('Could not save. Try again.'); el.disabled = false; }
      return;
    }
    case 'me':
      toast('Demo mode: signed in as Spencer');
      return;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.event[data-action]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset?.filter;
  if (k) { state.filters[k] = e.target.value; render(); }
  if (e.target.matches('[data-mapowner]')) { state.mapOwner = e.target.value; state.mapView = null; render(); }
  if (e.target.matches('[data-maptype]')) { state.mapType = e.target.value; state.mapView = null; render(); }
});

/* ---------- Search ---------- */
const searchInput = $('#search'), results = $('#search-results');
let hits = [], hitIdx = 0;
function closeSearch() { results.hidden = true; }
function runSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { closeSearch(); return; }
  const accHits = state.accounts.filter(a => [a.name, a.city, a.state, a.specialty, a.account_type, a.health_system].some(v => (v || '').toLowerCase().includes(q)))
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || a.name.localeCompare(b.name)).slice(0, 7)
    .map(a => ({ href: `#/account/${a.id}`, title: a.name, sub: [a.city, a.state].filter(Boolean).join(', ') }));
  const conHits = state.contacts.filter(c => [c.name, c.email].some(v => (v || '').toLowerCase().includes(q))).slice(0, 4)
    .map(c => ({ href: `#/account/${c.account_id}`, title: c.name, sub: acct(c.account_id)?.name || 'Contact' }));
  hits = [...accHits, ...conHits]; hitIdx = 0;
  results.innerHTML = hits.length
    ? hits.map((h, i) => `<a href="${h.href}" class="${i === 0 ? 'on' : ''}"><span>${esc(h.title)}</span><small>${esc(h.sub)}</small></a>`).join('')
    : `<div class="empty">No account or person matches "${esc(searchInput.value)}". <button type="button" class="btn sm" data-action="new-account" data-name="${esc(searchInput.value.trim())}">Add it as an account</button></div>`;
  results.hidden = false;
}
searchInput.addEventListener('input', runSearch);
searchInput.addEventListener('focus', runSearch);
searchInput.addEventListener('keydown', e => {
  const links = [...results.querySelectorAll('a[href^="#/"]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!links.length) return;
    hitIdx = (hitIdx + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length;
    links.forEach((l, i) => l.classList.toggle('on', i === hitIdx));
  } else if (e.key === 'Enter' && links[hitIdx]) {
    e.preventDefault(); location.hash = links[hitIdx].getAttribute('href'); searchInput.value = ''; searchInput.blur();
  } else if (e.key === 'Escape') { searchInput.value = ''; closeSearch(); searchInput.blur(); }
});
results.addEventListener('click', e => { if (e.target.closest('a')) { searchInput.value = ''; closeSearch(); } });
document.addEventListener('mousedown', e => { if (!e.target.closest('.search')) closeSearch(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.matches('input, textarea, select') && !$('#modal-root').children.length) { e.preventDefault(); searchInput.focus(); }
});

/* ---------- Auth ---------- */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, err = $('#login-error'), btn = f.querySelector('button');
  btn.disabled = true; err.hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
  btn.disabled = false;
  if (error) { err.textContent = 'That email and password did not match. Try again.'; err.hidden = false; }
});

async function onSession(session) {
  state.session = session;
  $('#login').hidden = !!session;
  $('#app').hidden = !session;
  if (!session) { state.loaded = false; return; }
  render();
  await loadAll();
  render();
}

if (!cfg.SUPABASE_URL || cfg.SUPABASE_URL.startsWith('PASTE')) {
  document.body.innerHTML = '<div class="login"><div class="login-card"><h1>Almost there</h1><p>Open this file in Notepad, find SETUP near the top, paste in your Supabase Project URL and anon public key, save, and reload.</p></div></div>';
} else {
  let first = true, lastToken = null;
  sb.auth.onAuthStateChange((evt, session) => {
    if (evt === 'TOKEN_REFRESHED') { state.session = session; lastToken = session?.access_token || null; return; }
    const tok = session?.access_token || null;
    if (first || tok !== lastToken) { first = false; lastToken = tok; setTimeout(() => onSession(session), 0); }
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && state.session) { await loadAll(); render(); }
  });
}

</script>
